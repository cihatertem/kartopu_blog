<section class="sidebar-card">
  <h3 class="sidebar-title">Ara</h3>

  <form method="get" action="{% url 'blog:search_results' %}" class="sidebar-form">
    <label for="sidebar-search-query">Aranacak kelimeler</label>
    <input
      id="sidebar-search-query"
      type="search"
      name="q"
      placeholder="Blogda ara..."
      value="{{ q|default:'' }}"
      class="input-field"
    />
    <label for="sidebar-search-mode">Arama türü</label>
    <select id="sidebar-search-mode" name="mode" class="input-field">
      <option value="exact"{% if mode != "stemmed" %} selected{% endif %}>Kelime araması</option>
      <option value="stemmed"{% if mode == "stemmed" %} selected{% endif %}>Türkçe kök araması</option>
    </select>
    <button type="submit" class="btn">Ara</button>
  </form>
</section>
